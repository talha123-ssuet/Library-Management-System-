<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | Talha Library</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav>

        <div class="nav-left">
            <img src="images/Logo.png.jpg" class="logo" alt="Library Logo">
            <h2>Talha Library</h2>
        </div>

        <div class="nav-right">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </div>

    </nav>

    <div class="container">

        <div class="card" style="max-width:550px;margin:auto;">

            <h1>Create Account</h1>

            <p>Create your Library Account</p>

            <div class="form-group">
                <input type="text" placeholder="Full Name">
            </div>

            <div class="form-group">
                <input type="email" placeholder="Email Address">
            </div>

            <div class="form-group">
                <input type="text" placeholder="Username">
            </div>

            <div class="form-group">
                <input type="password" placeholder="Password">
            </div>

            <button class="btn btn-success" style="width:100%;" onclick="signup()"></button>
                Create Account
            </button>

            <br><br>

            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
